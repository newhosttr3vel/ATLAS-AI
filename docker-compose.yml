services:
  api:
    build: .
    container_name: atlas-ai-api
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  dashboard:
    build: .
    container_name: atlas-ai-dashboard
    command: ["streamlit", "run", "dashboard/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    env_file:
      - .env
    environment:
      ATLAS_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped
